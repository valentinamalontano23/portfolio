# Builds the site and publishes it to GitHub Pages on every push to main.
#
# dist/ is gitignored on purpose: it is rebuilt here, so the repository never
# carries two copies of a 12 MB bundle. The reels in public/videos/ ARE in the
# repository — they are source, not build output — and get copied into dist/
# by Vite.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; the newer push wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # vite 8 needs ^20.19 || >=22.12
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
